<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">The parts of an onboarding report</title><desc id="d">A sample report contains a 30-second summary, architecture map, entry point trace, dependency table, setup and tests, first contributions, and unknowns.</desc><rect width="1200" height="430" rx="24" fill="#111629"/><text x="38" y="48" fill="#c6c2ff" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3">THE DELIVERABLE</text><text x="38" y="84" fill="#fff" font-family="Arial" font-size="30" font-weight="800">A report you can use to get your bearings</text><g font-family="Arial"><rect x="38" y="111" width="1124" height="278" rx="16" fill="#1d223b" stroke="#515983"/><rect x="38" y="111" width="1124" height="45" rx="16" fill="#2b2c51"/><circle cx="62" cy="133" r="6" fill="#f08ca8"/><circle cx="82" cy="133" r="6" fill="#e8c96b"/><circle cx="102" cy="133" r="6" fill="#6bd3a5"/><text x="130" y="139" fill="#e7e5ff" font-size="15" font-weight="700">CODEBASE ONBOARDING REPORT.md</text><g><rect x="64" y="177" width="490" height="74" rx="10" fill="#29274c" stroke="#7974e3"/><text x="84" y="202" fill="#c7c2ff" font-size="14" font-weight="700">01 · FAST SUMMARY</text><text x="84" y="229" fill="#fff" font-size="18">What it does, for whom, evidence</text><rect x="574" y="177" width="560" height="74" rx="10" fill="#1e383b" stroke="#54cdb8"/><text x="594" y="202" fill="#a5f2e1" font-size="14" font-weight="700">02 · ARCHITECTURE + STARTUP</text><text x="594" y="229" fill="#fff" font-size="18">What calls what and where execution starts</text><rect x="64" y="266" width="330" height="93" rx="10" fill="#34263e" stroke="#d994bf"/><text x="84" y="291" fill="#f1c2df" font-size="14" font-weight="700">03 · SETUP + TESTS</text><text x="84" y="320" fill="#fff" font-size="16">Commands and caveats</text><text x="84" y="342" fill="#ead8e7" font-size="13">Documented vs inferred</text><rect x="414" y="266" width="330" height="93" rx="10" fill="#383223" stroke="#e2c36a"/><text x="434" y="291" fill="#ffe6a3" font-size="14" font-weight="700">04 · CONTRIBUTION IDEAS</text><text x="434" y="320" fill="#fff" font-size="16">Three to five small tasks</text><text x="434" y="342" fill="#e9dfc3" font-size="13">Each with a test plan</text><rect x="764" y="266" width="370" height="93" rx="10" fill="#22362f" stroke="#67d2a2"/><text x="784" y="291" fill="#aaf0cb" font-size="14" font-weight="700">05 · WHAT WE DON'T KNOW</text><text x="784" y="320" fill="#fff" font-size="16">Gaps, risks and next step</text><text x="784" y="342" fill="#cce8d9" font-size="13">No invented certainty</text></g></g></svg>