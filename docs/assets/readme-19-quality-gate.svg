<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d"><title id="t">Quality gate before sending the onboarding report</title><desc id="d">Before delivering, check the sources, startup path, command status, file paths, first-issue scope, and unknowns.</desc><rect width="1200" height="380" rx="24" fill="#13162b"/><text x="38" y="48" fill="#c8c3ff" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3">FINAL QUALITY GATE</text><text x="38" y="84" fill="#fff" font-family="Arial" font-size="30" font-weight="800">Before you trust the report, check six things</text><g font-family="Arial"><g transform="translate(38 118)"><rect width="350" height="66" rx="12" fill="#1b3933" stroke="#64d6a5"/><circle cx="30" cy="33" r="13" fill="#2c9d70"/><path d="M22 33l6 6 11-14" stroke="#fff" stroke-width="3" fill="none"/><text x="55" y="29" fill="#fff" font-size="17" font-weight="700">Source was actually inspected</text><text x="55" y="50" fill="#c5ead8" font-size="13">Not guessed from project name</text></g><g transform="translate(425 118)"><rect width="350" height="66" rx="12" fill="#1b3933" stroke="#64d6a5"/><circle cx="30" cy="33" r="13" fill="#2c9d70"/><path d="M22 33l6 6 11-14" stroke="#fff" stroke-width="3" fill="none"/><text x="55" y="29" fill="#fff" font-size="17" font-weight="700">Every arrow has evidence</text><text x="55" y="50" fill="#c5ead8" font-size="13">Calls and data paths are grounded</text></g><g transform="translate(812 118)"><rect width="350" height="66" rx="12" fill="#1b3933" stroke="#64d6a5"/><circle cx="30" cy="33" r="13" fill="#2c9d70"/><path d="M22 33l6 6 11-14" stroke="#fff" stroke-width="3" fill="none"/><text x="55" y="29" fill="#fff" font-size="17" font-weight="700">Commands are labeled</text><text x="55" y="50" fill="#c5ead8" font-size="13">Documented, inferred or tested</text></g><g transform="translate(38 204)"><rect width="350" height="66" rx="12" fill="#1f2b43" stroke="#77b6f7"/><circle cx="30" cy="33" r="13" fill="#397fc0"/><path d="M22 33l6 6 11-14" stroke="#fff" stroke-width="3" fill="none"/><text x="55" y="29" fill="#fff" font-size="17" font-weight="700">No secret values exposed</text><text x="55" y="50" fill="#cadbee" font-size="13">Names may be reported, values redacted</text></g><g transform="translate(425 204)"><rect width="350" height="66" rx="12" fill="#33263c" stroke="#d993bf"/><circle cx="30" cy="33" r="13" fill="#a7548c"/><text x="30" y="39" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">?</text><text x="55" y="29" fill="#fff" font-size="17" font-weight="700">Unknowns are clearly shown</text><text x="55" y="50" fill="#edd6e7" font-size="13">No invented certainty</text></g><g transform="translate(812 204)"><rect width="350" height="66" rx="12" fill="#383223" stroke="#e4c76c"/><circle cx="30" cy="33" r="13" fill="#a5802c"/><text x="30" y="39" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">!</text><text x="55" y="29" fill="#fff" font-size="17" font-weight="700">First task is small</text><text x="55" y="50" fill="#e9dfc5" font-size="13">Has a concrete verification step</text></g></g><text x="38" y="327" fill="#b7bddb" font-family="Arial" font-size="15">If a check fails, fix or qualify the report before presenting it as reliable.</text></svg>