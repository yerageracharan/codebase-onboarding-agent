<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="t d"><title id="t">Three ways to use the skill</title><desc id="d">Use a supported native skill installation, use a coding assistant that loads Agent Skills from a folder, or paste SKILL.md into an ordinary chat as a manual fallback.</desc><rect width="1200" height="370" rx="24" fill="#11172c"/><text x="38" y="48" fill="#c5c1ff" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3">INSTALLATION DEPENDS ON YOUR TOOL</text><text x="38" y="84" fill="#fff" font-family="Arial" font-size="30" font-weight="800">Three valid ways to start</text><g font-family="Arial"><g transform="translate(38 119)"><rect width="354" height="188" rx="16" fill="#242345" stroke="#8982ff"/><circle cx="39" cy="39" r="20" fill="#685bd9"/><path d="M29 39l7 7 14-16" stroke="#fff" stroke-width="3" fill="none"/><text x="72" y="45" fill="#fff" font-size="20" font-weight="700">Native skill upload</text><text x="24" y="92" fill="#d0ceec" font-size="16">If your app has a Skills page</text><text x="24" y="118" fill="#d0ceec" font-size="16">and your account is eligible.</text><text x="24" y="157" fill="#b9b4ff" font-size="14">Follow that product's current guide.</text></g><g transform="translate(423 119)"><rect width="354" height="188" rx="16" fill="#1d3439" stroke="#57d2bd"/><circle cx="39" cy="39" r="20" fill="#248a7b"/><path d="M29 32h20v14H29zM34 27h10v5" stroke="#fff" stroke-width="2" fill="none"/><text x="72" y="45" fill="#fff" font-size="20" font-weight="700">Skills directory</text><text x="24" y="92" fill="#c9e9e5" font-size="16">For compatible coding assistants</text><text x="24" y="118" fill="#c9e9e5" font-size="16">that load a local skill folder.</text><text x="24" y="157" fill="#91ebd8" font-size="14">Use the directory expected by the tool.</text></g><g transform="translate(808 119)"><rect width="354" height="188" rx="16" fill="#34263c" stroke="#da94bf"/><circle cx="39" cy="39" r="20" fill="#ad5893"/><path d="M29 29h20v20H29zM34 35h10M34 40h10" stroke="#fff" stroke-width="2" fill="none"/><text x="72" y="45" fill="#fff" font-size="20" font-weight="700">Manual fallback</text><text x="24" y="92" fill="#efd9e7" font-size="16">Paste SKILL.md into a chat</text><text x="24" y="118" fill="#efd9e7" font-size="16">and attach the source code.</text><text x="24" y="157" fill="#f0bbdc" font-size="14">No persistent install; may repeat per chat.</text></g></g><text x="38" y="340" fill="#b7bddb" font-family="Arial" font-size="14">Native features, upload options and account eligibility change. Verify using official product docs.</text></svg>