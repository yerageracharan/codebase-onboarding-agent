<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="t d"><title id="t">Map the data flow</title><desc id="d">Map the input, validation, core logic, storage or external services when actually present, and output.</desc><rect width="1200" height="370" rx="24" fill="#11172d"/><text x="38" y="47" fill="#c7c3ff" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3">FOLLOW THE DATA</text><text x="38" y="83" fill="#fff" font-family="Arial" font-size="30" font-weight="800">Ask five questions about the program</text><g font-family="Arial"><g transform="translate(38 124)"><rect width="205" height="150" rx="15" fill="#242544" stroke="#837cff"/><text x="20" y="33" fill="#c7c3ff" font-size="13" font-weight="700">01 · INPUT</text><text x="20" y="69" fill="#fff" font-size="21" font-weight="700">What comes in?</text><text x="20" y="105" fill="#c5c8e5" font-size="15">Request, file, event</text><text x="20" y="128" fill="#c5c8e5" font-size="15">or user action</text></g><path d="M249 199h25l-8-8m8 8-8 8" stroke="#aaa4ff" stroke-width="4" fill="none"/><g transform="translate(280 124)"><rect width="205" height="150" rx="15" fill="#1c333d" stroke="#55d3bc"/><text x="20" y="33" fill="#9af2df" font-size="13" font-weight="700">02 · CHECK</text><text x="20" y="69" fill="#fff" font-size="21" font-weight="700">What is checked?</text><text x="20" y="105" fill="#c7e9e6" font-size="15">Validation, parsing,</text><text x="20" y="128" fill="#c7e9e6" font-size="15">permission checks</text></g><path d="M491 199h25l-8-8m8 8-8 8" stroke="#aaa4ff" stroke-width="4" fill="none"/><g transform="translate(522 124)"><rect width="205" height="150" rx="15" fill="#34283e" stroke="#d995c0"/><text x="20" y="33" fill="#f0bcdb" font-size="13" font-weight="700">03 · CORE</text><text x="20" y="69" fill="#fff" font-size="21" font-weight="700">What changes?</text><text x="20" y="105" fill="#efd8e8" font-size="15">Main calculations</text><text x="20" y="128" fill="#efd8e8" font-size="15">and decisions</text></g><path d="M733 199h25l-8-8m8 8-8 8" stroke="#aaa4ff" stroke-width="4" fill="none"/><g transform="translate(764 124)"><rect width="170" height="150" rx="15" fill="#393221" stroke="#e3c468"/><text x="16" y="33" fill="#ffe5a0" font-size="13" font-weight="700">04 · SIDE EFFECT</text><text x="16" y="69" fill="#fff" font-size="20" font-weight="700">Where does it go?</text><text x="16" y="105" fill="#e9dfc2" font-size="14">DB, API, file—</text><text x="16" y="128" fill="#e9dfc2" font-size="14">only if observed</text></g><path d="M941 199h25l-8-8m8 8-8 8" stroke="#aaa4ff" stroke-width="4" fill="none"/><g transform="translate(971 124)"><rect width="190" height="150" rx="15" fill="#20362e" stroke="#69d4a1"/><text x="18" y="33" fill="#b0f3cf" font-size="13" font-weight="700">05 · OUTPUT</text><text x="18" y="69" fill="#fff" font-size="21" font-weight="700">What leaves?</text><text x="18" y="105" fill="#cee9da" font-size="14">Response, report,</text><text x="18" y="128" fill="#cee9da" font-size="14">or event</text></g></g><text x="38" y="327" fill="#b6bdd8" font-family="Arial" font-size="15">Don't add a database, cache or external API to the map unless the code supports it.</text></svg>