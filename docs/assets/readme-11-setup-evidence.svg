<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="t d"><title id="t">How to write reliable setup instructions</title><desc id="d">Separate documented commands, inferred commands, and commands actually tested.</desc><rect width="1200" height="350" rx="24" fill="#14172d"/><text x="38" y="48" fill="#c5c2ff" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3">SETUP WITHOUT BLUFFING</text><text x="38" y="84" fill="#fff" font-family="Arial" font-size="30" font-weight="800">Three labels that stop bad instructions</text><g font-family="Arial"><g transform="translate(38 118)"><rect width="350" height="185" rx="16" fill="#1d3933" stroke="#63d6a5" stroke-width="2"/><circle cx="32" cy="34" r="15" fill="#319d71"/><path d="M24 34l6 6 11-14" stroke="#fff" stroke-width="3" fill="none"/><text x="60" y="40" fill="#b4f4d2" font-size="20" font-weight="800">DOCUMENTED</text><text x="23" y="84" fill="#fff" font-size="16">README, manifest or workflow</text><text x="23" y="111" fill="#cde9da" font-size="16">states this command exists.</text><text x="23" y="157" fill="#98e7be" font-size="14" font-weight="700">Cite where you found it</text></g><g transform="translate(425 118)"><rect width="350" height="185" rx="16" fill="#393221" stroke="#e2c367" stroke-width="2"/><circle cx="32" cy="34" r="15" fill="#a88028"/><text x="32" y="40" fill="#fff" text-anchor="middle" font-size="19" font-weight="800">~</text><text x="60" y="40" fill="#ffe5a0" font-size="20" font-weight="800">INFERRED</text><text x="23" y="84" fill="#fff" font-size="16">Looks likely from convention,</text><text x="23" y="111" fill="#e9dfc1" font-size="16">but isn't documented.</text><text x="23" y="157" fill="#e7d28c" font-size="14" font-weight="700">Call it a suggestion, not fact</text></g><g transform="translate(812 118)"><rect width="350" height="185" rx="16" fill="#262844" stroke="#8a83ff" stroke-width="2"/><circle cx="32" cy="34" r="15" fill="#6d62dd"/><path d="M23 34h18M32 25v18" stroke="#fff" stroke-width="3"/><text x="60" y="40" fill="#d0ccff" font-size="20" font-weight="800">TESTED</text><text x="23" y="84" fill="#fff" font-size="16">Actually ran in an available</text><text x="23" y="111" fill="#d2d2eb" font-size="16">environment and saw result.</text><text x="23" y="157" fill="#b9b4ff" font-size="14" font-weight="700">Only say this when true</text></g></g></svg>