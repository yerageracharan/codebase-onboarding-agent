<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d"><title id="t">A safe first contribution loop</title><desc id="d">Observe a real issue, choose a small scope, change one thing, run the relevant check, explain the change, and ask for review.</desc><rect width="1200" height="400" rx="24" fill="#12172c"/><text x="38" y="48" fill="#c4c0ff" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3">FROM ONBOARDING TO CONTRIBUTION</text><text x="38" y="84" fill="#fff" font-family="Arial" font-size="30" font-weight="800">One small change. A clear way to prove it worked.</text><g font-family="Arial"><g transform="translate(38 133)"><rect width="165" height="155" rx="15" fill="#292449" stroke="#9084ff"/><text x="20" y="32" fill="#c5beff" font-size="13" font-weight="700">01</text><text x="20" y="69" fill="#fff" font-size="19" font-weight="700">Observe</text><text x="20" y="101" fill="#cdcee9" font-size="14">Find a real gap</text><text x="20" y="123" fill="#cdcee9" font-size="14">in source or docs.</text></g><path d="M207 210h18" stroke="#a8a2ff" stroke-width="4"/><g transform="translate(230 133)"><rect width="165" height="155" rx="15" fill="#20363a" stroke="#55d2bd"/><text x="20" y="32" fill="#9bf2df" font-size="13" font-weight="700">02</text><text x="20" y="69" fill="#fff" font-size="19" font-weight="700">Scope</text><text x="20" y="101" fill="#c8e9e5" font-size="14">Make the smallest</text><text x="20" y="123" fill="#c8e9e5" font-size="14">useful change.</text></g><path d="M399 210h18" stroke="#a8a2ff" stroke-width="4"/><g transform="translate(422 133)"><rect width="165" height="155" rx="15" fill="#39283f" stroke="#d995c0"/><text x="20" y="32" fill="#f2bcdb" font-size="13" font-weight="700">03</text><text x="20" y="69" fill="#fff" font-size="19" font-weight="700">Change</text><text x="20" y="101" fill="#ecd6e7" font-size="14">Touch only the</text><text x="20" y="123" fill="#ecd6e7" font-size="14">needed files.</text></g><path d="M591 210h18" stroke="#a8a2ff" stroke-width="4"/><g transform="translate(614 133)"><rect width="165" height="155" rx="15" fill="#3a3221" stroke="#e5c66b"/><text x="20" y="32" fill="#ffe5a2" font-size="13" font-weight="700">04</text><text x="20" y="69" fill="#fff" font-size="19" font-weight="700">Verify</text><text x="20" y="101" fill="#e9dfc2" font-size="14">Run the relevant</text><text x="20" y="123" fill="#e9dfc2" font-size="14">test or check.</text></g><path d="M783 210h18" stroke="#a8a2ff" stroke-width="4"/><g transform="translate(806 133)"><rect width="165" height="155" rx="15" fill="#23324a" stroke="#80b8fa"/><text x="20" y="32" fill="#b5d9ff" font-size="13" font-weight="700">05</text><text x="20" y="69" fill="#fff" font-size="19" font-weight="700">Explain</text><text x="20" y="101" fill="#cfdeef" font-size="14">Say what changed</text><text x="20" y="123" fill="#cfdeef" font-size="14">and why.</text></g><path d="M975 210h18" stroke="#a8a2ff" stroke-width="4"/><g transform="translate(998 133)"><rect width="165" height="155" rx="15" fill="#22392e" stroke="#73d5a6"/><text x="20" y="32" fill="#a9f3c8" font-size="13" font-weight="700">06</text><text x="20" y="69" fill="#fff" font-size="19" font-weight="700">Review</text><text x="20" y="101" fill="#cde9d8" font-size="14">Let the maintainer</text><text x="20" y="123" fill="#cde9d8" font-size="14">check the change.</text></g></g><text x="38" y="343" fill="#b8bddb" font-family="Arial" font-size="15">A “good first issue” should be small, grounded in the code, and testable—not just sound easy.</text></svg>