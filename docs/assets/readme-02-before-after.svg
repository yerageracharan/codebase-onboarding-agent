<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">From unfamiliar codebase to clear next step</title><desc id="d">Before: confusing folders, files, and commands. After: an architecture map, setup walkthrough, and small contribution plan.</desc><rect width="1200" height="360" rx="24" fill="#17172c"/><g font-family="Arial"><rect x="40" y="44" width="470" height="267" rx="20" fill="#302239" stroke="#d579a5" stroke-width="2"/><text x="72" y="82" fill="#ffb5d6" font-size="16" font-weight="700" letter-spacing="2">BEFORE</text><text x="72" y="119" fill="#fff" font-size="28" font-weight="800">“Which file do I open?”</text><g fill="#422b46" stroke="#a75a85"><rect x="72" y="145" width="175" height="40" rx="8"/><rect x="264" y="145" width="210" height="40" rx="8"/><rect x="72" y="196" width="220" height="40" rx="8"/><rect x="308" y="196" width="166" height="40" rx="8"/><rect x="72" y="247" width="145" height="40" rx="8"/><rect x="233" y="247" width="241" height="40" rx="8"/></g><g fill="#f3dce9" font-size="15"><text x="86" y="170">src/</text><text x="278" y="170">package.json</text><text x="86" y="221">config/</text><text x="322" y="221">tests/</text><text x="86" y="272">main?</text><text x="247" y="272">too many unknowns</text></g><path d="M535 178h100l-20-20m20 20-20 20" stroke="#aca6ff" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="660" y="44" width="500" height="267" rx="20" fill="#1d3336" stroke="#55d7b5" stroke-width="2"/><text x="692" y="82" fill="#9ff8de" font-size="16" font-weight="700" letter-spacing="2">AFTER</text><text x="692" y="119" fill="#fff" font-size="28" font-weight="800">“I know what to do next.”</text><g><rect x="692" y="145" width="435" height="38" rx="8" fill="#244d4b"/><text x="710" y="170" fill="#d2fff3" font-size="16">Architecture map</text><rect x="692" y="195" width="435" height="38" rx="8" fill="#244d4b"/><text x="710" y="220" fill="#d2fff3" font-size="16">Setup and test commands</text><rect x="692" y="245" width="435" height="38" rx="8" fill="#244d4b"/><text x="710" y="270" fill="#d2fff3" font-size="16">3 small, evidence-based first tasks</text></g><text x="40" y="339" fill="#b6b7d4" font-size="14">The skill doesn't magically understand every repo. It follows a repeatable, evidence-based process.</text></g></svg>