<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="801" viewBox="0 0 1440 801">
<rect width="1440" height="801" fill="#eaf0f7"/>
<rect x="18" y="18" width="1404" height="765" rx="18" fill="#0b1728" stroke="#263b54" stroke-width="2"/>
