<circle cx="47" cy="47" r="8" fill="#ff6159"/><circle cx="74" cy="47" r="8" fill="#ffbd2e"/><circle cx="101" cy="47" r="8" fill="#28c840"/>
<text x="132" y="54" class="window">CLI help</text>
<text x="40" y="100" class="command">$ codebase-onboard --help</text><text x="40" y="126" class="out">usage: codebase-onboard [-h] [--output OUTPUT] [--with-ai | --static-only]</text><text x="40" y="153" class="out">                        [--version]</text><text x="40" y="180" class="out">                        source</text><text x="40" y="207" class="out"></text><text x="40" y="234" class="out">Create a beginner-friendly, evidence-backed Markdown guide to a local or</text><text x="40" y="261" class="out">public GitHub repository.</text><text x="40" y="288" class="out"></text><text x="40" y="315" class="out">positional arguments:</text><text x="40" y="342" class="out">  source                Local repository directory or public</text><text x="40" y="369" class="out">                        https://github.com/OWNER/REPOSITORY URL</text><text x="40" y="396" class="out"></text><text x="40" y="423" class="out">options:</text><text x="40" y="450" class="out">  -h, --help            show this help message and exit</text><text x="40" y="477" class="out">  --output OUTPUT, -o OUTPUT</text><text x="40" y="504" class="out">                        Markdown report path (default: onboarding-report.md)</text><text x="40" y="531" class="out">  --with-ai             Enhance the static report using a configured OpenAI-</text><text x="40" y="558" class="out">                        compatible model endpoint</text><text x="40" y="585" class="out">  --static-only         Run deterministic static analysis only (the default)</text><text x="40" y="612" class="out">  --version             show program&#x27;s version number and exit</text><text x="40" y="639" class="out"></text><text x="40" y="666" class="out">Privacy: static-only mode is the default and makes no model API calls. With</text><text x="40" y="693" class="out">--with-ai, selected redacted source excerpts are sent to the endpoint you</text><text x="40" y="720" class="out">configured. The target repository is never executed.</text>
<style>.window{font:600 20px Arial,sans-serif;fill:#e2ebf6}.command{font:600 18px monospace;fill:#6ee7b7}.out{font:17px monospace;fill:#edf4ff}</style></svg>