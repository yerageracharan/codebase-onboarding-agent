<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="t d"><title id="t">What you get from Codebase Onboarding Agent</title><desc id="d">Four practical outputs: understand the project, find where it starts, get it running, and choose a first contribution.</desc><rect width="1200" height="350" rx="24" fill="#11162c"/><text x="38" y="48" fill="#c5c8ff" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3">THE OUTCOME</text><text x="38" y="87" fill="#fff" font-family="Arial" font-size="32" font-weight="800">Go from “where do I even start?” to “I know my next step.”</text><g font-family="Arial"><g transform="translate(38 125)"><rect width="270" height="170" rx="16" fill="#20294a" stroke="#827aff"/><circle cx="40" cy="39" r="22" fill="#7568f4"/><text x="40" y="47" fill="#fff" text-anchor="middle" font-size="23" font-weight="700">1</text><text x="24" y="85" fill="#fff" font-size="21" font-weight="700">Understand</text><text x="24" y="117" fill="#c8ccea" font-size="16">What the project does</text><text x="24" y="141" fill="#c8ccea" font-size="16">and who it serves.</text></g><g transform="translate(326 125)"><rect width="270" height="170" rx="16" fill="#1c303c" stroke="#45cbb4"/><circle cx="40" cy="39" r="22" fill="#229b89"/><text x="40" y="47" fill="#fff" text-anchor="middle" font-size="23" font-weight="700">2</text><text x="24" y="85" fill="#fff" font-size="21" font-weight="700">Trace</text><text x="24" y="117" fill="#c8e8e7" font-size="16">Where it starts, what</text><text x="24" y="141" fill="#c8e8e7" font-size="16">calls what.</text></g><g transform="translate(614 125)"><rect width="270" height="170" rx="16" fill="#332942" stroke="#e09ac9"/><circle cx="40" cy="39" r="22" fill="#b45d9b"/><text x="40" y="47" fill="#fff" text-anchor="middle" font-size="23" font-weight="700">3</text><text x="24" y="85" fill="#fff" font-size="21" font-weight="700">Get unstuck</text><text x="24" y="117" fill="#f0d4e8" font-size="16">Setup, dependencies,</text><text x="24" y="141" fill="#f0d4e8" font-size="16">tests and config.</text></g><g transform="translate(902 125)"><rect width="260" height="170" rx="16" fill="#303022" stroke="#e6c46b"/><circle cx="40" cy="39" r="22" fill="#aa8129"/><text x="40" y="47" fill="#fff" text-anchor="middle" font-size="23" font-weight="700">4</text><text x="24" y="85" fill="#fff" font-size="21" font-weight="700">Contribute</text><text x="24" y="117" fill="#eee1bd" font-size="16">Small first tasks with</text><text x="24" y="141" fill="#eee1bd" font-size="16">a way to verify.</text></g></g><text x="38" y="328" fill="#aeb5d9" font-family="Arial" font-size="14">No guessing. No mysterious jargon. Evidence first, confidence second.</text></svg>