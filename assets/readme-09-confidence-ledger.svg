<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">Separate facts from inferences and unknowns</title><desc id="d">A three-column confidence ledger: verified facts with file evidence, cautious inferences clearly labeled, and unknowns that need more information.</desc><rect width="1200" height="360" rx="24" fill="#14162b"/><text x="38" y="48" fill="#c5c1ff" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3">HONESTY CHECK</text><text x="38" y="83" fill="#fff" font-family="Arial" font-size="30" font-weight="800">Three buckets. Never blend them together.</text><g font-family="Arial"><g transform="translate(38 116)"><rect width="350" height="205" rx="16" fill="#1d3934" stroke="#64d6a7" stroke-width="2"/><circle cx="38" cy="38" r="18" fill="#2a9f74"/><path d="M29 38l6 6 12-14" fill="none" stroke="#fff" stroke-width="4"/><text x="68" y="44" fill="#b3f4d1" font-size="22" font-weight="800">VERIFIED FACT</text><text x="24" y="89" fill="#fff" font-size="17">“The CLI maps to cli.main.”</text><text x="24" y="120" fill="#cde9da" font-size="15">Evidence: pyproject.toml</text><text x="24" y="146" fill="#cde9da" font-size="15">and the registered symbol.</text><text x="24" y="180" fill="#8fe7bc" font-size="14" font-weight="700">Can point to the source</text></g><g transform="translate(425 116)"><rect width="350" height="205" rx="16" fill="#3a3220" stroke="#e0c060" stroke-width="2"/><circle cx="38" cy="38" r="18" fill="#aa8029"/><text x="38" y="45" fill="#fff" text-anchor="middle" font-size="20" font-weight="800">~</text><text x="68" y="44" fill="#ffe49a" font-size="22" font-weight="800">INFERENCE</text><text x="24" y="89" fill="#fff" font-size="17">“This may be the web entry.”</text><text x="24" y="120" fill="#e8dfc2" font-size="15">Evidence is suggestive,</text><text x="24" y="146" fill="#e8dfc2" font-size="15">but not conclusive.</text><text x="24" y="180" fill="#e9cf82" font-size="14" font-weight="700">Label it as a possibility</text></g><g transform="translate(812 116)"><rect width="350" height="205" rx="16" fill="#33263b" stroke="#d88fbd" stroke-width="2"/><circle cx="38" cy="38" r="18" fill="#b45d98"/><text x="38" y="45" fill="#fff" text-anchor="middle" font-size="22" font-weight="800">?</text><text x="68" y="44" fill="#f5c2e2" font-size="22" font-weight="800">UNKNOWN</text><text x="24" y="89" fill="#fff" font-size="17">“Deployment target not shown.”</text><text x="24" y="120" fill="#ebd4e5" font-size="15">The inspected files don't</text><text x="24" y="146" fill="#ebd4e5" font-size="15">prove what happens.</text><text x="24" y="180" fill="#efb7db" font-size="14" font-weight="700">Ask for more evidence</text></g></g></svg>