<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d"><title id="t">Repository inspection order</title><desc id="d">Start with README and contribution instructions, then manifests, app entry points, tests, config examples, and CI.</desc><rect width="1200" height="390" rx="24" fill="#10172d"/><text x="38" y="47" fill="#c3c1ff" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3">FIRST 10 MINUTES</text><text x="38" y="83" fill="#fff" font-family="Arial" font-size="30" font-weight="800">Read the clues in this order</text><g font-family="Arial"><g transform="translate(38 116)"><rect width="350" height="58" rx="12" fill="#29244f" stroke="#837cff"/><text x="21" y="24" fill="#bdb8ff" font-size="13" font-weight="700">01</text><text x="65" y="25" fill="#fff" font-size="19" font-weight="700">README / CONTRIBUTING</text><text x="65" y="45" fill="#c9c8e7" font-size="13">Purpose, quick start, project rules</text></g><g transform="translate(425 116)"><rect width="350" height="58" rx="12" fill="#1d333b" stroke="#4dd0b8"/><text x="21" y="24" fill="#8af3df" font-size="13" font-weight="700">02</text><text x="65" y="25" fill="#fff" font-size="19" font-weight="700">Manifest / lockfile</text><text x="65" y="45" fill="#c6e8e5" font-size="13">Language, dependencies, commands</text></g><g transform="translate(812 116)"><rect width="350" height="58" rx="12" fill="#34283b" stroke="#d993c0"/><text x="21" y="24" fill="#f4badd" font-size="13" font-weight="700">03</text><text x="65" y="25" fill="#fff" font-size="19" font-weight="700">Entry point / bootstrap</text><text x="65" y="45" fill="#ecd7e7" font-size="13">How execution actually begins</text></g><path d="M211 180v24h387v-24M598 180v24h389v-24" fill="none" stroke="#696e9b" stroke-width="2"/><g transform="translate(38 226)"><rect width="350" height="58" rx="12" fill="#3a3323" stroke="#e4c365"/><text x="21" y="24" fill="#ffe2a0" font-size="13" font-weight="700">04</text><text x="65" y="25" fill="#fff" font-size="19" font-weight="700">Tests and fixtures</text><text x="65" y="45" fill="#e9dfc2" font-size="13">Expected behavior and edge cases</text></g><g transform="translate(425 226)"><rect width="350" height="58" rx="12" fill="#243347" stroke="#78b7ff"/><text x="21" y="24" fill="#a8d3ff" font-size="13" font-weight="700">05</text><text x="65" y="25" fill="#fff" font-size="19" font-weight="700">Config examples</text><text x="65" y="45" fill="#cadcf0" font-size="13">Settings without exposing secret values</text></g><g transform="translate(812 226)"><rect width="350" height="58" rx="12" fill="#26352d" stroke="#71d2a0"/><text x="21" y="24" fill="#a4f0c6" font-size="13" font-weight="700">06</text><text x="65" y="25" fill="#fff" font-size="19" font-weight="700">CI and build files</text><text x="65" y="45" fill="#cce8d8" font-size="13">Checks maintainers expect to pass</text></g></g><text x="38" y="339" fill="#b3badb" font-family="Arial" font-size="15">Don't read every file in order. Follow the evidence from the project's documented start.</text></svg>