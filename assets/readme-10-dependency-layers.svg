<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="t d"><title id="t">Understand dependency layers</title><desc id="d">Runtime libraries, development tools, optional components, and external services have different roles and should be documented separately.</desc><rect width="1200" height="370" rx="24" fill="#11162b"/><text x="38" y="49" fill="#c2bfff" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3">DEPENDENCY MAP</text><text x="38" y="85" fill="#fff" font-family="Arial" font-size="30" font-weight="800">Not every dependency does the same job</text><g font-family="Arial"><g transform="translate(38 119)"><rect width="267" height="188" rx="16" fill="#202846" stroke="#7f7aff"/><text x="22" y="41" fill="#c8c4ff" font-size="20" font-weight="800">RUNTIME</text><text x="22" y="77" fill="#fff" font-size="16">Needed when the program</text><text x="22" y="101" fill="#fff" font-size="16">actually runs.</text><path d="M24 129h215" stroke="#5e5ab5" stroke-width="2"/><text x="22" y="160" fill="#bfc2e5" font-size="14">Evidence: imports + manifest</text></g><g transform="translate(333 119)"><rect width="267" height="188" rx="16" fill="#1a3437" stroke="#4ed2bf"/><text x="22" y="41" fill="#a3f4e5" font-size="20" font-weight="800">DEVELOPMENT</text><text x="22" y="77" fill="#fff" font-size="16">Tests, formatting, linting,</text><text x="22" y="101" fill="#fff" font-size="16">type checks.</text><path d="M24 129h215" stroke="#287f78" stroke-width="2"/><text x="22" y="160" fill="#bee6e1" font-size="14">Often optional for users</text></g><g transform="translate(628 119)"><rect width="267" height="188" rx="16" fill="#35273c" stroke="#d790bf"/><text x="22" y="41" fill="#f5c4e1" font-size="20" font-weight="800">OPTIONAL</text><text x="22" y="77" fill="#fff" font-size="16">UI, plugin, integrations,</text><text x="22" y="101" fill="#fff" font-size="16">extra capabilities.</text><path d="M24 129h215" stroke="#8d517e" stroke-width="2"/><text x="22" y="160" fill="#e8c9dd" font-size="14">Check optional groups</text></g><g transform="translate(923 119)"><rect width="239" height="188" rx="16" fill="#383121" stroke="#e5c76a"/><text x="22" y="41" fill="#ffe5a1" font-size="20" font-weight="800">EXTERNAL</text><text x="22" y="77" fill="#fff" font-size="16">Database, service,</text><text x="22" y="101" fill="#fff" font-size="16">model or cloud account.</text><path d="M24 129h191" stroke="#917a34" stroke-width="2"/><text x="22" y="160" fill="#e8dcb8" font-size="14">May need secrets/permissions</text></g></g><text x="38" y="340" fill="#bac0df" font-family="Arial" font-size="14">Only list what manifests and source actually support. Dependency purpose can be uncertain—say so.</text></svg>