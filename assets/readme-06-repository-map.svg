<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="t d"><title id="t">How to read a repository tree</title><desc id="d">A sample codebase file tree showing docs, package manifests, source code, tests, config and CI, and the questions each answers.</desc><rect width="1200" height="410" rx="24" fill="#12162b"/><text x="38" y="48" fill="#c6c3ff" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3">READ THE FOLDER TREE</text><text x="38" y="84" fill="#fff" font-family="Arial" font-size="30" font-weight="800">Folders are clues, not proof</text><g font-family="Arial"><rect x="38" y="111" width="470" height="259" rx="15" fill="#1e2340" stroke="#666bd0"/><text x="63" y="146" fill="#f7f6ff" font-size="20" font-weight="700">example-project/</text><g fill="#babdff" font-size="16"><text x="68" y="181">├─ README.md</text><text x="68" y="210">├─ pyproject.toml</text><text x="68" y="239">├─ src/</text><text x="68" y="268">├─ tests/</text><text x="68" y="297">├─ config.example.yaml</text><text x="68" y="326">└─ .github/workflows/</text></g><g><rect x="540" y="111" width="620" height="259" rx="15" fill="#1a2038" stroke="#424b72"/><g font-size="16"><text x="570" y="151" fill="#9fddff" font-weight="700">README.md</text><text x="770" y="151" fill="#cdd7ee">What is this? How do I start?</text><text x="570" y="187" fill="#a8f1de" font-weight="700">pyproject.toml</text><text x="770" y="187" fill="#cdd7ee">Which tools and packages?</text><text x="570" y="223" fill="#ffc3e4" font-weight="700">src/</text><text x="770" y="223" fill="#cdd7ee">Where is the implementation?</text><text x="570" y="259" fill="#ffe09b" font-weight="700">tests/</text><text x="770" y="259" fill="#cdd7ee">What behavior is checked?</text><text x="570" y="295" fill="#b6c8ff" font-weight="700">config.example.yaml</text><text x="770" y="295" fill="#cdd7ee">Which settings are expected?</text><text x="570" y="331" fill="#a6e5b8" font-weight="700">.github/workflows/</text><text x="770" y="331" fill="#cdd7ee">What gets checked automatically?</text></g></g></g></svg>