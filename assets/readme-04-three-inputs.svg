<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="t d"><title id="t">Three ways to give the skill a repository</title><desc id="d">Provide a public GitHub link, upload a source ZIP, or share selected files and the folder tree.</desc><rect width="1200" height="350" rx="24" fill="#15152c"/><text x="38" y="48" fill="#bebcff" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3">START WITH WHAT YOU HAVE</text><text x="38" y="83" fill="#fff" font-family="Arial" font-size="30" font-weight="800">Three ways to get the code in front of the assistant</text><g font-family="Arial"><g transform="translate(38 118)"><rect width="354" height="185" rx="16" fill="#202747" stroke="#8982ff"/><circle cx="55" cy="51" r="25" fill="#6557d9"/><path d="M48 43h15l-5-6m5 6-5 6M63 57H48l5 6-5-6" stroke="#fff" stroke-width="3" fill="none"/><text x="94" y="49" fill="#fff" font-size="22" font-weight="700">Public GitHub URL</text><text x="25" y="101" fill="#c9cbee" font-size="16">Best when repository pages</text><text x="25" y="126" fill="#c9cbee" font-size="16">and source files are accessible.</text><text x="25" y="163" fill="#a7a4ff" font-size="14">Example: github.com/owner/project</text></g><g transform="translate(423 118)"><rect width="354" height="185" rx="16" fill="#1c3338" stroke="#54d8bf"/><circle cx="55" cy="51" r="25" fill="#228a79"/><path d="M44 45h22v18H44zM49 40h12v5" stroke="#eafffa" stroke-width="3" fill="none"/><text x="94" y="49" fill="#fff" font-size="22" font-weight="700">Source ZIP</text><text x="25" y="101" fill="#c6e8e8" font-size="16">Best for private code or when</text><text x="25" y="126" fill="#c6e8e8" font-size="16">the assistant cannot browse GitHub.</text><text x="25" y="163" fill="#87ead6" font-size="14">Include source, manifests and tests</text></g><g transform="translate(808 118)"><rect width="354" height="185" rx="16" fill="#33263c" stroke="#d991c0"/><circle cx="55" cy="51" r="25" fill="#b55a99"/><path d="M44 39h15l8 8v18H44zM59 39v9h8" stroke="#fff0fa" stroke-width="3" fill="none"/><text x="94" y="49" fill="#fff" font-size="22" font-weight="700">Selected files</text><text x="25" y="101" fill="#f0d9e9" font-size="16">Good for a small project or</text><text x="25" y="126" fill="#f0d9e9" font-size="16">a focused question.</text><text x="25" y="163" fill="#f0bade" font-size="14">Add tree + entry-point files</text></g></g></svg>