<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d"><title id="t">Understand test layers</title><desc id="d">Unit tests check small functions, integration tests check connected components, end-to-end tests check a whole user path, and CI runs defined checks automatically.</desc><rect width="1200" height="390" rx="24" fill="#11162b"/><text x="38" y="48" fill="#c4c0ff" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3">TESTS ARE CLUES ABOUT EXPECTED BEHAVIOR</text><text x="38" y="83" fill="#fff" font-family="Arial" font-size="30" font-weight="800">Read tests to learn the rules of the project</text><g><path d="M60 319L260 114L460 319Z" fill="#4c479d" stroke="#afa9ff" stroke-width="2"/><path d="M125 250L260 151L395 250Z" fill="#337c82" stroke="#92eee0" stroke-width="2"/><path d="M190 194L260 150L330 194Z" fill="#dcab50" stroke="#ffe7a9" stroke-width="2"/><g font-family="Arial" text-anchor="middle"><text x="260" y="181" fill="#332817" font-size="15" font-weight="700">UNIT</text><text x="260" y="228" fill="#e4fffa" font-size="16" font-weight="700">INTEGRATION</text><text x="260" y="285" fill="#fff" font-size="17" font-weight="700">END-TO-END</text><text x="260" y="347" fill="#bcc0df" font-size="13">Small → whole path</text></g><g font-family="Arial"><rect x="515" y="118" width="645" height="57" rx="12" fill="#272648" stroke="#8b84ff"/><text x="540" y="143" fill="#d3cfff" font-size="17" font-weight="700">Unit test</text><text x="690" y="143" fill="#fff" font-size="16">Checks one small function in isolation.</text><text x="690" y="162" fill="#c5c8e6" font-size="13">Usually fast; often uses simple input/output examples.</text><rect x="515" y="189" width="645" height="57" rx="12" fill="#1d373b" stroke="#5bd5c1"/><text x="540" y="214" fill="#aaf5e5" font-size="17" font-weight="700">Integration</text><text x="690" y="214" fill="#fff" font-size="16">Checks that modules work together.</text><text x="690" y="233" fill="#c8e6e3" font-size="13">Can include a database, service or file format.</text><rect x="515" y="260" width="645" height="57" rx="12" fill="#37283b" stroke="#d897c2"/><text x="540" y="285" fill="#f4c2e1" font-size="17" font-weight="700">End-to-end</text><text x="690" y="285" fill="#fff" font-size="16">Checks a full user journey from start to finish.</text><text x="690" y="304" fill="#edd6e6" font-size="13">More realistic, but usually slower to run.</text></g></g><text x="515" y="351" fill="#b9bddc" font-family="Arial" font-size="14">A test file shows intended behavior; it does not prove tests passed unless run.</text></svg>