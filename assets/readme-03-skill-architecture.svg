<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d"><title id="t">Codebase Onboarding Agent architecture map</title><desc id="d">A user supplies a repository URL or source files. A compatible assistant uses available browsing or file tools, records evidence, traces startup and dependencies, checks uncertainty, and produces an onboarding report. The skill itself does not clone or execute code.</desc><rect width="1200" height="480" rx="24" fill="#101427"/><text x="36" y="45" fill="#c4c2ff" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3">ARCHITECTURE MAP</text><text x="36" y="82" fill="#fff" font-family="Arial" font-size="31" font-weight="800">A guided investigation, not a magic black box</text><g font-family="Arial" font-size="16"><g transform="translate(35 130)"><rect width="185" height="132" rx="15" fill="#262447" stroke="#8983ff"/><text x="20" y="35" fill="#d9d6ff" font-size="13" font-weight="700">STEP 1</text><text x="20" y="68" fill="#fff" font-size="20" font-weight="700">Input</text><text x="20" y="96" fill="#c8c8e4">GitHub URL, ZIP,</text><text x="20" y="118" fill="#c8c8e4">or source files</text></g><path d="M226 196h30l-9-8m9 8-9 8" stroke="#a5a2ff" stroke-width="4" fill="none"/><g transform="translate(265 130)"><rect width="185" height="132" rx="15" fill="#1c343c" stroke="#54d3be"/><text x="20" y="35" fill="#a7fae7" font-size="13" font-weight="700">STEP 2</text><text x="20" y="68" fill="#fff" font-size="20" font-weight="700">Inspect</text><text x="20" y="96" fill="#c6e9e6">Tree, README,</text><text x="20" y="118" fill="#c6e9e6">manifests, tests</text></g><path d="M456 196h30l-9-8m9 8-9 8" stroke="#a5a2ff" stroke-width="4" fill="none"/><g transform="translate(495 130)"><rect width="185" height="132" rx="15" fill="#312943" stroke="#d994c4"/><text x="20" y="35" fill="#f4c6e1" font-size="13" font-weight="700">STEP 3</text><text x="20" y="68" fill="#fff" font-size="20" font-weight="700">Trace</text><text x="20" y="96" fill="#edd7e8">Entry point, calls,</text><text x="20" y="118" fill="#edd7e8">data and outputs</text></g><path d="M686 196h30l-9-8m9 8-9 8" stroke="#a5a2ff" stroke-width="4" fill="none"/><g transform="translate(725 130)"><rect width="185" height="132" rx="15" fill="#3a3121" stroke="#e8c76b"/><text x="20" y="35" fill="#ffe6a2" font-size="13" font-weight="700">STEP 4</text><text x="20" y="68" fill="#fff" font-size="20" font-weight="700">Check</text><text x="20" y="96" fill="#efe2c2">Facts vs guesses</text><text x="20" y="118" fill="#efe2c2">vs unknowns</text></g><path d="M916 196h30l-9-8m9 8-9 8" stroke="#a5a2ff" stroke-width="4" fill="none"/><g transform="translate(955 130)"><rect width="210" height="132" rx="15" fill="#1e3530" stroke="#64d3a1"/><text x="20" y="35" fill="#adf4cf" font-size="13" font-weight="700">STEP 5</text><text x="20" y="68" fill="#fff" font-size="20" font-weight="700">Report</text><text x="20" y="96" fill="#cfe9da">Map, setup, tests</text><text x="20" y="118" fill="#cfe9da">and first issues</text></g></g><rect x="35" y="305" width="1130" height="110" rx="14" fill="#20233d" stroke="#555a81"/><text x="59" y="342" fill="#c7c9ea" font-family="Arial" font-size="15" font-weight="700">IMPORTANT BOUNDARY</text><text x="59" y="374" fill="#fff" font-family="Arial" font-size="20">The skill provides instructions. The assistant supplies the tools.</text><text x="59" y="398" fill="#c7c9ea" font-family="Arial" font-size="15">Without repository access, ask for a source ZIP. By default, inspect code; do not run unknown scripts.</text></svg>