<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d"><title id="t">Trace how a program starts</title><desc id="d">Start from the documented command, find the manifest mapping, open the entry point function, follow the main call and identify the output.</desc><rect width="1200" height="390" rx="24" fill="#14182e"/><text x="38" y="48" fill="#c5c1ff" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3">TRACE THE STARTUP PATH</text><text x="38" y="84" fill="#fff" font-family="Arial" font-size="30" font-weight="800">Follow one real path, not every file</text><g font-family="Arial"><g transform="translate(38 119)"><rect width="205" height="191" rx="16" fill="#292448" stroke="#9485ff"/><text x="20" y="35" fill="#c9c2ff" font-size="13" font-weight="700">1. COMMAND</text><text x="20" y="77" fill="#fff" font-size="19" font-weight="700">What the user runs</text><rect x="18" y="100" width="169" height="58" rx="8" fill="#16182b"/><text x="28" y="124" fill="#8de4d3" font-size="13">myapp start</text><text x="28" y="144" fill="#b8bddb" font-size="12">from docs or scripts</text></g><path d="M250 214h24l-8-8m8 8-8 8" stroke="#aaa3ff" stroke-width="4" fill="none"/><g transform="translate(280 119)"><rect width="205" height="191" rx="16" fill="#1d303b" stroke="#5dd8c1"/><text x="20" y="35" fill="#9af3df" font-size="13" font-weight="700">2. MANIFEST</text><text x="20" y="77" fill="#fff" font-size="19" font-weight="700">Find the mapping</text><rect x="18" y="100" width="169" height="58" rx="8" fill="#14272e"/><text x="28" y="124" fill="#8de4d3" font-size="13">script → main()</text><text x="28" y="144" fill="#b9dedc" font-size="12">only if declared</text></g><path d="M492 214h24l-8-8m8 8-8 8" stroke="#aaa3ff" stroke-width="4" fill="none"/><g transform="translate(522 119)"><rect width="205" height="191" rx="16" fill="#36283e" stroke="#df9ac4"/><text x="20" y="35" fill="#f4c7e3" font-size="13" font-weight="700">3. ENTRY POINT</text><text x="20" y="77" fill="#fff" font-size="19" font-weight="700">Open the function</text><rect x="18" y="100" width="169" height="58" rx="8" fill="#2a2034"/><text x="28" y="124" fill="#f0bbdc" font-size="13">main()</text><text x="28" y="144" fill="#ddbed3" font-size="12">read its actual body</text></g><path d="M734 214h24l-8-8m8 8-8 8" stroke="#aaa3ff" stroke-width="4" fill="none"/><g transform="translate(764 119)"><rect width="170" height="191" rx="16" fill="#363221" stroke="#e7ca70"/><text x="20" y="35" fill="#ffe8a2" font-size="13" font-weight="700">4. CALLS</text><text x="20" y="77" fill="#fff" font-size="19" font-weight="700">Follow imports</text><rect x="18" y="100" width="134" height="58" rx="8" fill="#2a281e"/><text x="28" y="124" fill="#ffe8a2" font-size="13">core logic</text><text x="28" y="144" fill="#e4d9ba" font-size="12">next real call</text></g><path d="M941 214h24l-8-8m8 8-8 8" stroke="#aaa3ff" stroke-width="4" fill="none"/><g transform="translate(971 119)"><rect width="190" height="191" rx="16" fill="#20352d" stroke="#68d6a6"/><text x="18" y="35" fill="#aaf0ca" font-size="13" font-weight="700">5. RESULT</text><text x="18" y="77" fill="#fff" font-size="19" font-weight="700">Find the effect</text><rect x="16" y="100" width="158" height="58" rx="8" fill="#142921"/><text x="26" y="124" fill="#aaf0ca" font-size="13">file / response</text><text x="26" y="144" fill="#c6e9d6" font-size="12">observe, don't guess</text></g></g><text x="38" y="350" fill="#b7bdd9" font-family="Arial" font-size="15">If there is no clear mapping, list the candidates and explain what evidence is missing.</text></svg>