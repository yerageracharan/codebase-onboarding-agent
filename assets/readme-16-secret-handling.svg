<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">Protect secrets during codebase onboarding</title><desc id="d">Identify the name and location of secret-like values without printing their values, and recommend safe example configuration instead of committing real secrets.</desc><rect width="1200" height="360" rx="24" fill="#13172c"/><text x="38" y="48" fill="#c7c3ff" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3">SECRET HYGIENE</text><text x="38" y="84" fill="#fff" font-family="Arial" font-size="30" font-weight="800">Explain the configuration. Never leak the key.</text><g font-family="Arial"><rect x="38" y="118" width="540" height="188" rx="16" fill="#202740" stroke="#8182ff"/><text x="63" y="153" fill="#d4d2ff" font-size="15" font-weight="700">EXAMPLE ENVIRONMENT FILE</text><text x="63" y="192" fill="#d7e4ff" font-size="18">API_KEY =</text><rect x="182" y="168" width="317" height="36" rx="8" fill="#702f48"/><text x="200" y="192" fill="#ffc3d6" font-size="18" font-weight="700">[REDACTED]</text><text x="63" y="238" fill="#c8cae5" font-size="15">Report: “A secret-like value appears in config.”</text><text x="63" y="269" fill="#b8bcdf" font-size="14">Name the file/key if useful; never repeat value.</text><path d="M595 213h58l-15-13m15 13-15 13" stroke="#aaa4ff" stroke-width="5" fill="none"/><rect x="674" y="118" width="488" height="188" rx="16" fill="#1b3731" stroke="#63d5a4"/><text x="700" y="153" fill="#b4f4d2" font-size="15" font-weight="700">SAFE ALTERNATIVE</text><rect x="700" y="173" width="435" height="56" rx="8" fill="#102721"/><text x="718" y="197" fill="#9df2c6" font-size="17">API_KEY=YOUR_KEY_HERE</text><text x="718" y="218" fill="#c3e8d6" font-size="13">Example only — not a working credential</text><text x="700" y="262" fill="#fff" font-size="15">Keep local .env files out of public Git.</text></g></svg>