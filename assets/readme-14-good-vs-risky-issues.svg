<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="t d"><title id="t">Choose a good first contribution</title><desc id="d">Good first tasks are narrow and testable. Risky first tasks are broad rewrites, undocumented assumptions, or integrations needing access and design decisions.</desc><rect width="1200" height="370" rx="24" fill="#15172c"/><text x="38" y="48" fill="#c6c2ff" font-family="Arial" font-size="15" font-weight="700" letter-spacing="3">SCOPE MATTERS</text><text x="38" y="84" fill="#fff" font-family="Arial" font-size="30" font-weight="800">Small and testable beats huge and vague</text><g font-family="Arial"><g transform="translate(38 119)"><rect width="545" height="207" rx="16" fill="#1b3831" stroke="#63d8a6" stroke-width="2"/><text x="26" y="42" fill="#aaf4cc" font-size="21" font-weight="800">GOOD FIRST TASK</text><g fill="#fff" font-size="17"><text x="28" y="84">✓ Document one real command</text><text x="28" y="118">✓ Add a test for a visible edge case</text><text x="28" y="152">✓ Improve one confusing error message</text><text x="28" y="186">✓ Add a safe, non-secret example</text></g></g><g transform="translate(617 119)"><rect width="545" height="207" rx="16" fill="#38262f" stroke="#d77c9e" stroke-width="2"/><text x="26" y="42" fill="#ffb8ce" font-size="21" font-weight="800">RISKY FIRST TASK</text><g fill="#fff" font-size="17"><text x="28" y="84">× Rewrite the whole architecture</text><text x="28" y="118">× Add a new framework without a need</text><text x="28" y="152">× Change auth or security blindly</text><text x="28" y="186">× Guess product behavior that isn't specified</text></g></g></g></svg>