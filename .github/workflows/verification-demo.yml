name: Verification demo

on:
  push:
    branches: [main]
    paths-ignore:
      - "examples/verification/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CLI and test tools
        run: python -m pip install -e ".[test]"
      - name: Capture version and help
        run: |
          mkdir -p examples/verification
          codebase-onboard --version | tee examples/verification/01-version.txt
          codebase-onboard --help | tee examples/verification/02-help.txt
      - name: Analyze the included synthetic project
        run: |
          codebase-onboard examples/toy-python-project --output examples/verification/toy-taskboard-report.md --static-only | tee examples/verification/03-toy-run.txt
      - name: Run the agent's own tests
        run: python -m pytest -v | tee examples/verification/05-test-results.txt
      - name: Separately test and run the synthetic example
        run: |
          PYTHONPATH=examples/toy-python-project/src python -m pytest -v examples/toy-python-project/tests | tee examples/verification/06-toy-project-tests.txt
          PYTHONPATH=examples/toy-python-project/src python -m taskboard.cli | tee examples/verification/07-toy-project-run.txt
      - name: Verify invalid repository URL handling without network access
        shell: bash
        run: |
          set +e
          codebase-onboard https://example.com/not-a-github-repo --output /tmp/should-not-exist.md --static-only > examples/verification/08-invalid-url.txt 2>&1
          status=$?
          set -e
          echo "exit_code=$status" >> examples/verification/08-invalid-url.txt
          test "$status" -eq 2
          test ! -e /tmp/should-not-exist.md
      - name: Render screenshot captures from real command output and report
        if: always()
        run: python scripts/generate_verification_screenshots.py
      - name: Upload run evidence as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codebase-onboarding-verification-${{ github.run_id }}
          path: examples/verification/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit generated example report, logs, and screenshots
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/verification/
          if git diff --cached --quiet; then
            echo "Verification evidence is already up to date."
            exit 0
          fi
          git commit -m "Add reproducible CLI example and execution screenshots"
          if ! git push origin HEAD:main; then
            echo "::warning::Could not commit run evidence to main; the workflow artifact above still contains the captured files."
          fi
