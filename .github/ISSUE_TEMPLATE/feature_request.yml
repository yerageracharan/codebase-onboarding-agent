name: Feature request
description: Propose an onboarding or repository-analysis improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: Explain whether this touches target-code execution, repository downloads, secret handling, or archive limits.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Synthetic fixture and validation plan
    validations:
      required: true
